spring:
  application:
    name: ebms-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ebms}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456789}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080

ebms:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-very-long-development-secret-key-1234567890}
    expiration-ms: 86400000
  fraud:
    velocity:
      window-minutes: 10
      max-tx: 10
    blocked-countries: KP,IR,SY
  notifications:
    from-email: noreply@ebms.local
    sms-sender: EBMS

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.bank: DEBUG
    org.springframework.security: INFO
