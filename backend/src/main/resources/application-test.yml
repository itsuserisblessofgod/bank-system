spring:
  datasource:
    url: jdbc:h2:mem:ebms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

ebms:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-test-secret-1234567890
    expiration-ms: 3600000
  fraud:
    velocity:
      window-minutes: 10
      max-tx: 10
    blocked-countries: KP,IR
